name: Update listings

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright beautifulsoup4 lxml
      - run: playwright install --with-deps chromium
      - name: Fetch venue pages
        run: python scripts/snapshot.py
      - name: Read the pages and update shows.json
        run: python scripts/collect.py
      - name: Add Ticketmaster links
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python scripts/ticketmaster.py
      - name: Build venue, city and category pages
        run: python scripts/build_pages.py
      - name: Save the new listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          GEN="shows.json health.json tm_venues.json seen.json sitemap.xml assets venues cities categories pantomime christmas-shows new"
          save() { git add -A $(for f in $GEN; do [ -e "$f" ] && echo "$f"; done); git commit -m "Update listings" || echo "no changes"; }
          save
          # This run takes ~40 minutes. If a site change was pushed meanwhile, do not try to merge the
          # generated files: keep our freshly built copies, start again from the newest code, and push.
          for i in 1 2 3; do
            git push && exit 0
            git fetch origin main
            rm -f /tmp/gen.tar
            tar -cf /tmp/gen.tar $(for f in $GEN; do [ -e "$f" ] && echo "$f"; done)
            git reset --hard origin/main
            rm -rf venues cities categories pantomime christmas-shows new
            tar -xf /tmp/gen.tar
            save
            sleep 3
          done
          echo "Could not push after 3 tries"; exit 1
      - name: Check the listings are healthy
        run: python scripts/health_check.py
