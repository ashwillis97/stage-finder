name: Update listings

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-listings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright beautifulsoup4 lxml
      - run: playwright install --with-deps chromium
      - name: Fetch venue pages
        run: python scripts/snapshot.py
      - name: Read the pages and update shows.json
        run: python scripts/collect.py
      - name: Add Ticketmaster links
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python scripts/ticketmaster.py
      - name: Build venue, city and category pages
        run: python scripts/build_pages.py
      - name: Save the new listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A shows.json health.json venues cities categories assets sitemap.xml
          git add tm_venues.json || true
          git commit -m "Update listings" || echo "no changes"
          git pull --rebase --autostash origin main
          git push
      - name: Check the listings are healthy
        run: python scripts/health_check.py
