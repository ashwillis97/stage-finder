<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stage Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: a programme-style list. Each show is a ticket stub (start date) beside the details, grouped under month headings. */
:root {
  --bg: #0b0e13;
  --surface: #141922;
  --fg: #e9edf3;
  --muted: #8d98a8;
  --line: #263041;
  --accent: #4da3ff;
  --accent-fg: #04101f;
  --accent-soft: #112238;
  --live: #7cc0ff;
  --live-soft: #14304d;
  --font-display: "Bebas Neue", "Oswald", "Arial Narrow", Impact, sans-serif;
  --font-body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "DM Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #eceff3; --surface: #ffffff; --fg: #0d1117; --muted: #5b6676; --line: #d3d9e2;
    --accent: #1457b8; --accent-fg: #ffffff; --accent-soft: #e1ecfa;
    --live: #1457b8; --live-soft: #dbe8f9;
    color-scheme: light;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(44px, 9vw, 68px); line-height: .95; letter-spacing: .02em; margin: 0; }
.sub { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.stamp { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 18px; border-radius: 6px; border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-fg); font-family: var(--font-display); font-size: 19px; letter-spacing: .06em; line-height: 1; text-decoration: none; white-space: nowrap; }
.btn:hover { filter: brightness(1.1); }
.controls { display: flex; flex-direction: column; gap: 12px; }
.search-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.2fr) minmax(0, .8fr) minmax(0, .8fr); gap: 10px; }
.field { min-width: 0; }
.field label { display: block; font-family: var(--font-display); font-size: 15px; letter-spacing: .1em; color: var(--muted); margin-bottom: 3px; }
.field input, .field select { width: 100%; min-height: 44px; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); }
.field input[type="date"] { padding: 0 8px; }
.count { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.coverage { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 0 16px; }
.coverage summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 600; font-size: 14px; }
.cov { display: flex; flex-direction: column; gap: 10px; padding: 0 0 16px; font-size: 14px; color: var(--muted); }
.cov h4 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 18px; letter-spacing: .06em; color: var(--fg); }
.cov ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
.list, .group { display: flex; flex-direction: column; gap: 12px; }
h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; letter-spacing: .08em; color: var(--muted); margin: 12px 0 0; }
.row { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stub { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 14px 8px; border-right: 2px dashed var(--line); background: var(--accent-soft); text-align: center; }
.stub .dow, .stub .mon { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.stub .dow { color: var(--muted); }
.stub .mon { color: var(--accent); font-weight: 500; }
.stub .day { font-family: var(--font-display); font-size: 44px; line-height: .95; }
.info { padding: 14px 16px; min-width: 0; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.info h3 { font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: .03em; line-height: 1.02; margin: 0; overflow-wrap: anywhere; }
.venue { font-weight: 600; font-size: 15px; }
.venue span { color: var(--muted); font-weight: 400; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 14px; color: var(--muted); }
.meta .run { font-family: var(--font-mono); font-size: 13px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.tag.live { background: var(--live-soft); color: var(--live); border-color: transparent; font-weight: 600; }
.act { display: flex; align-items: center; padding: 14px 16px 14px 0; }
.empty, .error { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 28px 20px; text-align: center; color: var(--muted); }
.empty strong, .error strong { display: block; color: var(--fg); font-family: var(--font-display); font-weight: 400; font-size: 28px; letter-spacing: .04em; margin-bottom: 4px; }
@media (max-width: 720px) {
  .search-row { grid-template-columns: 1fr 1fr; }
  .search-row .field:nth-child(1), .search-row .field:nth-child(2) { grid-column: 1 / -1; }
}
@media (max-width: 600px) {
  body { padding-block: 20px 40px; }
  .row { grid-template-columns: 64px minmax(0, 1fr); }
  .stub { padding: 10px 4px; }
  .stub .day { font-size: 34px; }
  .info { padding: 10px 12px 4px; gap: 3px; }
  .info h3 { font-size: 25px; }
  .venue { font-size: 14px; }
  .act { grid-column: 2; padding: 4px 12px 12px; }
  .btn { min-height: 34px; padding: 0 14px; font-size: 17px; }
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <h1>Stage Finder</h1>
    <p class="sub">What's on across your theatres, soonest first. <span class="stamp" id="stamp" aria-live="polite"></span></p>
  </header>

  <div class="controls">
    <div class="search-row">
      <div class="field">
        <label for="q">Search</label>
        <input id="q" type="search" placeholder="Show, theatre or genre" autocomplete="off">
      </div>
      <div class="field">
        <label for="venue">Theatre</label>
        <select id="venue"><option value="">All theatres</option></select>
      </div>
      <div class="field">
        <label for="from">From</label>
        <input id="from" type="date">
      </div>
      <div class="field">
        <label for="to">To</label>
        <input id="to" type="date">
      </div>
    </div>
    <div class="count" id="count"></div>
  </div>

  <details class="coverage" id="coverage" hidden><summary>Venues with missing or partial listings</summary><div class="cov" id="covBody"></div></details>

  <div class="list" id="list"><div class="empty"><strong>Loading</strong>Fetching the latest listings.</div></div>
</div>

<script>
(function () {
  var shows = [], coverage = null;
  var $ = function (id) { return document.getElementById(id); };
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DOW3 = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var PLACE = {
    "Derby Theatre": ["Derby Theatre", "Derby"], "Vaillant Live": ["Vaillant Live", "Derby"],
    "Brewhouse Arts Centre": ["Brewhouse Arts Centre", "Burton-on-Trent"], "Lichfield Garrick": ["Lichfield Garrick", "Lichfield"],
    "Buxton Opera House": ["Buxton Opera House", "Buxton"], "Theatre Royal Nottingham": ["Theatre Royal", "Nottingham"],
    "Royal Concert Hall": ["Royal Concert Hall", "Nottingham"], "Nottingham Playhouse": ["Nottingham Playhouse", "Nottingham"],
    "Bonington Theatre": ["Bonington Theatre", "Arnold"], "Curve Theatre": ["Curve Theatre", "Leicester"],
    "De Montfort Hall": ["De Montfort Hall", "Leicester"], "Century Theatre": ["Century Theatre", "Coalville"],
    "Palace Theatre Mansfield": ["Palace Theatre", "Mansfield"], "Birmingham Hippodrome": ["Birmingham Hippodrome", "Birmingham"],
    "The Rep": ["The Rep", "Birmingham"], "The Alexandra Theatre": ["The Alexandra Theatre", "Birmingham"],
    "The Old Rep Theatre": ["The Old Rep Theatre", "Birmingham"], "Wolverhampton Grand Theatre": ["Wolverhampton Grand Theatre", "Wolverhampton"],
    "Regent Theatre Stoke": ["Regent Theatre", "Stoke-on-Trent"], "New Vic Theatre": ["New Vic Theatre", "Newcastle-under-Lyme"],
    "Winding Wheel Theatre": ["Winding Wheel Theatre", "Chesterfield"]
  };

  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML.replace(/"/g, "&quot;"); }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }
  function nameOf(t) { return PLACE[t] ? PLACE[t][0] : t; }
  function cityOf(t) { return PLACE[t] ? PLACE[t][1] : ""; }
  function label(t) { return cityOf(t) ? nameOf(t) + ", " + cityOf(t) : nameOf(t); }
  var todayIso = iso(new Date());

  function runText(s) {
    var a = parse(s.start), b = parse(s.end);
    var left = a.getDate() + " " + MON3[a.getMonth()];
    var right = b.getDate() + " " + MON3[b.getMonth()] + (b.getFullYear() !== a.getFullYear() ? " " + b.getFullYear() : "");
    return s.start === s.end ? left : left + " to " + right;
  }

  function buildVenues() {
    var counts = {};
    shows.forEach(function (s) { if (s.end >= todayIso) counts[s.theatre] = (counts[s.theatre] || 0) + 1; });
    var names = Object.keys(counts).sort(function (a, b) { return label(a).localeCompare(label(b)); });
    var cur = $("venue").value;
    $("venue").innerHTML = '<option value="">All theatres</option>' + names.map(function (n) {
      return '<option value="' + esc(n) + '">' + esc(label(n)) + " (" + counts[n] + ")</option>";
    }).join("");
    $("venue").value = names.indexOf(cur) >= 0 ? cur : "";
  }

  function renderCoverage() {
    var box = $("coverage");
    if (!coverage) { box.hidden = true; return; }
    var none = coverage.none || [], part = coverage.partial || {}, html = "";
    if (none.length) html += "<div><h4>No listings found</h4><ul>" + none.map(function (n) { return "<li>" + esc(label(n)) + "</li>"; }).join("") + "</ul></div>";
    var pk = Object.keys(part);
    if (pk.length) html += "<div><h4>Incomplete</h4><ul>" + pk.map(function (n) { return "<li><strong>" + esc(label(n)) + ":</strong> " + esc(part[n]) + "</li>"; }).join("") + "</ul></div>";
    box.hidden = !html; $("covBody").innerHTML = html;
  }

  function render() {
    var q = $("q").value.trim().toLowerCase();
    var from = $("from").value, to = $("to").value, v = $("venue").value;
    var rows = shows.filter(function (s) {
      if (s.end < todayIso) return false;
      if (from && s.end < from) return false;
      if (to && s.start > to) return false;
      if (v && s.theatre !== v) return false;
      if (q && (s.title + " " + label(s.theatre) + " " + (s.genre || "")).toLowerCase().indexOf(q) < 0) return false;
      return true;
    }).sort(function (a, b) {
      return a.start < b.start ? -1 : a.start > b.start ? 1 : a.title.localeCompare(b.title);
    });
    var filtered = v || q || from || to;
    $("count").textContent = rows.length + (rows.length === 1 ? " show" : " shows") + (filtered ? " match" : " on or coming up");
    if (!rows.length) {
      $("list").innerHTML = '<div class="empty"><strong>No shows found</strong>Try clearing the search, the dates or the theatre.</div>';
      return;
    }
    var html = "", lastKey = "";
    rows.forEach(function (s) {
      var d = parse(s.start);
      var running = s.start <= todayIso;
      var key = running ? "Now on" : MONTHS[d.getMonth()] + " " + d.getFullYear();
      if (key !== lastKey) {
        if (lastKey) html += "</div>";
        html += '<div class="group"><h2>' + esc(key.toUpperCase()) + "</h2>";
        lastKey = key;
      }
      var city = cityOf(s.theatre);
      html += '<article class="row">' +
        '<div class="stub"><span class="dow">' + DOW3[d.getDay()] + '</span><span class="day">' + d.getDate() + '</span><span class="mon">' + MON3[d.getMonth()] + "</span></div>" +
        '<div class="info"><h3>' + esc(s.title) + '</h3><div class="venue">' + esc(nameOf(s.theatre)) + (city ? ", <span>" + esc(city) + "</span>" : "") + "</div>" +
        '<div class="meta"><span class="run">' + esc(runText(s)) + "</span>" +
        (s.genre ? '<span class="tag">' + esc(s.genre) + "</span>" : "") +
        (running ? '<span class="tag live">Now on</span>' : "") + "</div></div>" +
        '<div class="act"><a class="btn" href="' + esc(safeUrl(s.url)) + '" target="_blank" rel="noopener noreferrer">VIEW SHOW</a></div>' +
        "</article>";
    });
    html += "</div>";
    $("list").innerHTML = html;
  }

  function stamp(t) {
    var d = new Date(t);
    $("stamp").textContent = isNaN(d) ? "" : "Updated " + d.getDate() + " " + MON3[d.getMonth()] + ", " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  fetch("shows.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("status " + r.status); return r.json(); })
    .then(function (data) {
      shows = Array.isArray(data.shows) ? data.shows : [];
      coverage = data.coverage || null;
      buildVenues(); renderCoverage(); render(); stamp(data.updated);
    })
    .catch(function () {
      $("list").innerHTML = '<div class="error"><strong>Listings did not load</strong>Check your connection and reload the page.</div>';
    });

  ["q", "from", "to"].forEach(function (id) { $(id).addEventListener("input", render); });
  $("venue").addEventListener("change", render);
})();
</script>
</body>
</html>
