name: Snapshot venue pages

on:
  workflow_dispatch:
    inputs:
      which:
        description: "existing = the live venues; new = all pending venues in venues_new.json; retry = only pending venues flagged retry"
        default: existing
        type: choice
        options: [existing, new, retry]

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python scripts/snapshot.py ${{ inputs.which == 'new' && 'new' || inputs.which == 'retry' && 'retry' || '' }}
      - name: Save snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          git commit -m "Update venue page snapshots" || echo "nothing to commit"
          git push
