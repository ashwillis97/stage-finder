name: Search Console report
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 1"
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - run: python scripts/gsc.py
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      - uses: actions/upload-artifact@v4
        with:
          name: gsc-report
          path: gsc_report.json
          retention-days: 90
