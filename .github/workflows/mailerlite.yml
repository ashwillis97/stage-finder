name: MailerLite
on:
  workflow_dispatch:
    inputs:
      action:
        description: "check = test the key and set up the group"
        default: check
        type: choice
        options: [check]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/mailerlite.py ${{ inputs.action }}
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
      - name: Save the result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mailerlite_info.json
          git commit -m "MailerLite check" || echo "nothing to commit"
          git pull --rebase origin main && git push
